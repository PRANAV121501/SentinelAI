[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisnet"
version = "0.1.0"
description = "AegisNet: Autonomous Threat Detection & Incident Response Platform"
authors = [{ name = "Pranav", email = "student@university.edu" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.8.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
